<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;background:transparent}
.bg{width:512px;height:512px;border-radius:112px;background:radial-gradient(circle at 30% 20%,#2b2350 0%,#15122a 60%,#0d0b1c 100%);display:flex;align-items:center;justify-content:center}
.tile{position:relative;width:392px;height:392px;border-radius:28px;background:linear-gradient(160deg,#8b6cff 0%,#5b3fd6 55%,#3a24a8 100%);box-shadow:0 0 0 6px rgba(255,255,255,.14) inset,0 24px 60px rgba(0,0,0,.55);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff}
.num{position:absolute;top:26px;left:32px;font-size:58px;font-weight:700;opacity:.95}
.mass{position:absolute;top:34px;right:32px;font-size:40px;font-weight:600;opacity:.75}
.sym{position:absolute;left:0;right:0;top:112px;text-align:center;font-size:148px;font-weight:800;letter-spacing:-6px;line-height:1}
.name{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:40px;font-weight:600;letter-spacing:1px;opacity:.9}
</style></head><body><div class="bg"><div class="tile">
<div class="num">7</div><div class="mass">27</div>
<div class="sym">KiPo</div><div class="name">Kipocium</div>
</div></div></body></html>
